<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="../src/assets/favicon.ico">
  <title>Inventory - Gem Incremental</title>
  <link rel="stylesheet" href="../inventory/inventory.css">
</head>

<body>
  <main class="inventory-page">
    <h1>Inventory</h1>
  
    <p id="inventoryCount">0 / 15</p>
  
    <p id="money">$0.00</p>
  
    <a href="../index.html">← Back to Rolling</a>

    <section class="capacity-upgrade">
      <h2>Inventory Capacity</h2>
    
      <p id="capacityStatus">
        15 slots
      </p>
    
      <p id="capacityUpgradeInfo">
        Next upgrade: 20 slots — $1,000
      </p>
    
      <button id="capacityUpgradeButton">
        Upgrade Capacity
      </button>
    </section>
  
    <div class="inventory-tabs">
      <button
        id="gemsTab"
        class="tab-button active"
      >
        Gems
      </button>
  
      <button
        id="equipmentTab"
        class="tab-button"
      >
        Equipment
      </button>
    </div>
  
    <section
      id="gemsSection"
      class="inventory-section"
    >
      <div
        id="inventoryList"
        class="inventory-list"
      ></div>
    </section>
  
    <section
      id="equipmentSection"
      class="inventory-section hidden"
    >
      <div
        id="equipmentList"
        class="equipment-list"
      ></div>
    </section>
  </main>

  <script type="module" src="./inventory.js"></script>
</body>
</html>
